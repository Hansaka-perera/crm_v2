{% extends "base.html" %}
{% block crumb %}Activities / {% if activity %}Edit{% else %}New{% endif %}{% endblock %}
{% block content %}
<h2>{% if activity %}Edit activity{% else %}Add an activity{% endif %}</h2>
<form method="post" class="form-grid">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="field">Type
    <select name="type">{% for t in types %}<option {% if activity and activity.type==t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select>
  </label>
  <label class="field">Due <input type="datetime-local" name="due_at" value="{{ activity.due_at.strftime('%Y-%m-%dT%H:%M') if activity and activity.due_at else '' }}"></label>
  <label class="field full">Subject <input name="subject" required value="{{ activity.subject if activity else '' }}"></label>
  <label class="field">Person
    <select name="person_id"><option value="">—</option>{% for p in people %}<option value="{{ p.id }}" {% if activity and activity.person_id==p.id %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select>
  </label>
  <label class="field">Organization
    <select name="organization_id"><option value="">—</option>{% for o in organizations %}<option value="{{ o.id }}" {% if activity and activity.organization_id==o.id %}selected{% endif %}>{{ o.name }}</option>{% endfor %}</select>
  </label>
  <label class="field">Deal
    <select name="deal_id"><option value="">—</option>{% for d in deals %}<option value="{{ d.id }}" {% if activity and activity.deal_id==d.id %}selected{% endif %}>{{ d.title }}</option>{% endfor %}</select>
  </label>
  <label class="field">Done <input type="checkbox" name="done" {% if activity and activity.done %}checked{% endif %}></label>
  <label class="field full">Notes <textarea name="notes">{{ activity.notes if activity else '' }}</textarea></label>
  <div class="full"><button class="btn btn-primary">Save</button></div>
</form>
{% endblock %}
