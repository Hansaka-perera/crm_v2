{% set qargs = request.args.to_dict() %}
{% if qargs.get('page') %}{% set _ = qargs.pop('page') %}{% endif %}
<div class="pager">
  {% if pagination.has_prev %}
    <a class="btn btn-outline btn-sm" href="{{ url_for(request.endpoint, page=pagination.prev_num, **qargs) }}">Previous</a>
  {% endif %}
  <span>Page {{ pagination.page }} of {{ pagination.pages or 1 }} · {{ pagination.total }} records</span>
  {% if pagination.has_next %}
    <a class="btn btn-outline btn-sm" href="{{ url_for(request.endpoint, page=pagination.next_num, **qargs) }}">Next</a>
  {% endif %}
</div>
