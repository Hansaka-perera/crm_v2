{% extends "base.html" %}
{% block crumb %}Deals / {% if deal %}Edit{% else %}New{% endif %}{% endblock %}
{% block content %}
<h2>{% if deal %}Edit deal{% else %}Add a deal{% endif %}</h2>
<form method="post" class="form-grid">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="field full">Title <input name="title" required value="{{ deal.title if deal else '' }}"></label>
  <label class="field">Value <input type="number" step="0.01" name="value" value="{{ deal.value if deal else 0 }}"></label>
  <label class="field">Currency <input name="currency" value="{{ deal.currency if deal else 'LKR' }}"></label>
  <label class="field">Stage
    <select name="stage">{% for s in stages %}<option {% if deal and deal.stage==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select>
  </label>
  <label class="field">Status
    <select name="status">
      {% for s in ['open','won','lost'] %}<option value="{{ s }}" {% if deal and deal.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}
    </select>
  </label>
  <label class="field">Organization
    <select name="organization_id"><option value="">—</option>{% for o in organizations %}<option value="{{ o.id }}" {% if deal and deal.organization_id==o.id %}selected{% endif %}>{{ o.name }}</option>{% endfor %}</select>
  </label>
  <label class="field">Contact person
    <select name="person_id"><option value="">—</option>{% for p in people %}<option value="{{ p.id }}" {% if deal and deal.person_id==p.id %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select>
  </label>
  <label class="field">Expected close date <input type="date" name="expected_close_date" value="{{ deal.expected_close_date.isoformat() if deal and deal.expected_close_date else '' }}"></label>
  <label class="field">Next activity date <input type="date" name="next_activity_date" value="{{ deal.next_activity_date.isoformat() if deal and deal.next_activity_date else '' }}"></label>
  <div class="full"><button class="btn btn-primary">Save</button> <a class="btn btn-outline" href="{{ url_for('deals.list_deals') }}">Cancel</a></div>
</form>
{% endblock %}
