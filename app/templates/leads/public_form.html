<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ form.name }} — ITGlow CRM</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="login-brand"><span class="brand-mark">IG</span><strong>ITGlow CRM</strong></div>
    <h1>{{ form.name }}</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <label>Name <input name="name" required></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Phone <input name="phone"></label>
    <label>Organization <input name="organization"></label>
    <label>Message <textarea name="message"></textarea></label>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:12px;">Submit</button>
  </form>
</div>
</body>
</html>
